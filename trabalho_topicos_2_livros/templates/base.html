{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Book Rating Dataset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-1: #070707;
            --bg-2: #1b0909;
            --panel: rgba(24, 16, 16, 0.94);
            --gold: #d9b250;
            --gold-soft: #f4d37d;
            --red: #b91c1c;
            --text: #f8f4ef;
            --text-soft: #e2d8cb;
            --muted: #d1cabd;
            --line: rgba(217, 178, 80, 0.4);
        }

        body {
            background: radial-gradient(circle at top, #2a0d0d 0%, var(--bg-2) 18%, var(--bg-1) 55%);
            color: var(--text);
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6,
        .navbar-brand,
        .nav-link,
        .section-title,
        .card,
        .hero-card,
        .hub-kicker,
        strong,
        p,
        li,
        td,
        th,
        label,
        .small,
        .lead {
            color: var(--text) !important;
        }

        .navbar {
            background: rgba(12, 10, 10, 0.9);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }

        .navbar-brand,
        .nav-link {
            color: var(--text) !important;
        }

        .nav-link:hover,
        .navbar-brand:hover {
            color: var(--gold-soft) !important;
        }

        .card {
            background: linear-gradient(180deg, rgba(27, 17, 17, 0.98), rgba(18, 14, 14, 0.98));
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(58, 18, 18, 0.9), rgba(25, 20, 20, 0.96));
        }

        .section-title {
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
            color: var(--gold-soft) !important;
        }

        .table {
            color: var(--text);
            --bs-table-bg: transparent;
            --bs-table-striped-bg: rgba(217, 178, 80, 0.04);
            --bs-table-hover-bg: rgba(185, 28, 28, 0.12);
            --bs-table-border-color: rgba(217, 178, 80, 0.25);
        }

        .table thead th {
            background: linear-gradient(90deg, rgba(185, 28, 28, 0.9), rgba(217, 178, 80, 0.8));
            color: #fff8eb;
            border-bottom: none;
        }

        .text-secondary,
        .text-muted,
        .small,
        p,
        li,
        td,
        th,
        .lead {
            color: var(--text-soft) !important;
        }

        .badge {
            border: 1px solid rgba(217, 178, 80, 0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--red), #7f1d1d);
            border: none;
            color: #fff;
            box-shadow: 0 8px 18px rgba(185, 28, 28, 0.35);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #991b1b, var(--red));
        }

        .btn-outline-warning {
            color: var(--gold-soft);
            border-color: var(--gold);
        }

        .btn-outline-warning:hover {
            background: var(--gold);
            color: #1b0d0d;
            border-color: var(--gold);
        }

        .hero-card {
            background: linear-gradient(135deg, rgba(40, 10, 10, 0.9), rgba(20, 15, 15, 0.96));
            border: 1px solid rgba(217, 178, 80, 0.4);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        .hub-kicker {
            display: inline-block;
            color: var(--gold-soft) !important;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.5rem 0.85rem;
            border: 1px solid rgba(217, 178, 80, 0.45);
            border-radius: 999px;
            background: rgba(217, 178, 80, 0.06);
        }

        .js-plotly-plot,
        .plotly-graph-div,
        .plotly-graph-div svg,
        .plotly-graph-div .svg-container {
            background: transparent !important;
        }

        pre {
            background: #120f0f !important;
            color: #f6f1eb !important;
            border: 1px solid rgba(217, 178, 80, 0.25);
        }

        pre.bg-light,
        .card pre {
            background: #120f0f !important;
            color: #f8f4ef !important;
            border: 1px solid rgba(217, 178, 80, 0.25);
        }

        code {
            color: #f8f4ef !important;
            background: transparent !important;
        }

        .list-group-item {
            background: rgba(18, 14, 14, 0.9) !important;
            color: var(--text) !important;
            border-color: rgba(217, 178, 80, 0.25) !important;
        }

        .list-group-item strong {
            color: var(--gold-soft) !important;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.12);
            color: var(--text);
            border: 1px solid rgba(96, 165, 250, 0.4);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Amazon Books</a>
            <div class="d-flex gap-3 align-items-center">
                <a class="nav-link" href="/">Hub</a>
                <a class="nav-link" href="/graficos/">Gráficos</a>
                <a class="nav-link" href="/sentimento/">Análise de Sentimento</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
