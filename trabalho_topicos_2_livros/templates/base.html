{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Book Rating Dataset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; color: #1f2937; }
        .card { border: none; border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
        .stat-card { background: linear-gradient(135deg, #ffffff 0%, #eef4ff 100%); }
        .section-title { margin-top: 2rem; margin-bottom: 1rem; font-weight: 700; }
        .table thead th { background: #0d6efd; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Amazon Books</a>
            <div class="d-flex gap-3">
                <a class="nav-link text-white" href="/">Dashboard</a>
                <a class="nav-link text-white" href="/sentimento/">Análise de Sentimento</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
